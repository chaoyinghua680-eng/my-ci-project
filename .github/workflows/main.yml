name: My First CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 把代码拉取到虚拟服务器上
      uses: actions/checkout@v3

    - name: 安装 Python 3.10 环境
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: 安装测试工具包 (pytest)
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: 运行自动化测试！(关键防线)
      run: |
        pytest
